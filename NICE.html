<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Overlay Antrian 1v1</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;background:transparent;
    font-family:Arial,Helvetica,sans-serif;color:#fff;
    overflow:hidden;
  }

  /* Panel utama */
  .queue{
    width:390px;
    padding:0 14px 16px;
    border-radius:16px;
    background:linear-gradient(145deg,rgba(31,24,55,.96),rgba(21,18,42,.94));
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 12px 35px rgba(0,0,0,.38);
  }

  .title{
    margin:0 -14px 12px;
    padding:13px 17px 10px;
    border-radius:16px 16px 0 0;
    background:linear-gradient(90deg,#39305e,#302850);
    display:flex;align-items:center;gap:9px;
  }
  .game{font-size:25px}
  .title-main{font-size:20px;font-weight:800}
  .subtitle{
    font-size:11px;font-weight:900;letter-spacing:3px;
    color:#ff5b79;margin-top:0;
  }

  .row{
    display:flex;align-items:center;gap:9px;
    min-height:54px;margin:8px 0;
    padding:7px 9px;
    border-radius:10px;
    background:linear-gradient(90deg,rgba(70,56,98,.78),rgba(44,37,70,.72));
    border:1px solid rgba(255,255,255,.07);
  }

  .num{
    width:30px;height:30px;flex:0 0 30px;
    display:grid;place-items:center;
    border-radius:8px;
    background:#697086;color:#fff;font-weight:900;
    font-size:15px;
  }
  .row:first-of-type .num{
    background:#ff3857;
  }

  .info{min-width:0;flex:1}
  .name{
    font-size:14px;font-weight:800;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .score{
    font-size:11px;color:#c8c5d2;margin-top:3px;
    font-weight:700;
  }

  .live{
    background:#ff4058;color:#fff;
    padding:5px 7px;border-radius:5px;
    font-size:9px;font-weight:900;
    animation:pulse 1.2s infinite;
  }

  .empty{
    opacity:.45;text-align:center;
    padding:18px 5px;font-size:13px;
  }

  @keyframes pulse{
    50%{opacity:.45}
  }

  /* Panel kontrol */
  #admin{
    position:fixed;right:15px;bottom:15px;
    width:320px;padding:14px;
    background:rgba(15,15,22,.96);
    border:1px solid #444;border-radius:12px;
    color:white;z-index:99;
    font-family:Arial,sans-serif;
  }
  #admin h3{margin:0 0 10px}
  #admin input{
    width:100%;padding:9px;margin:4px 0;
    border-radius:7px;border:1px solid #555;
    background:#252530;color:white;
  }
  #admin button{
    border:0;border-radius:7px;padding:9px 11px;
    margin:5px 3px 0 0;cursor:pointer;font-weight:700;
  }
  .primary{background:#ff4058;color:#fff}
  .secondary{background:#ddd;color:#111}
  .danger{background:#63303a;color:#fff}
  .hint{font-size:11px;color:#aaa;margin-top:9px;line-height:1.4}

  /* Sembunyikan kontrol saat dipakai sebagai overlay */
  body.overlay-only #admin{display:none}
</style>
</head>
<body>

<div class="queue">
  <div class="title">
    <div class="subtitle">ANTRIAN 1V1</div>
  </div>
  <div id="list"></div>
</div>

<div id="admin">
  <h3>⚙️ Kontrol Antrian</h3>
  <input id="name" placeholder="@username">
  <input id="score" placeholder="Score / angka" value="444">
  <button class="primary" onclick="addPlayer()">+ Tambah</button>
  <button class="secondary" onclick="nextPlayer()">▶ Giliran Berikutnya</button>
  <button class="danger" onclick="clearQueue()">Hapus Semua</button>
  <div class="hint">
    Klik "Giliran Berikutnya" untuk menghapus pemain nomor 1.
    Status LIVE otomatis berada di pemain pertama.
  </div>
</div>

<script>
const STORAGE_KEY = "overlay_antrian_1v1";
let players = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
}

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  if(players.length === 0){
    list.innerHTML = '<div class="empty">Belum ada pemain dalam antrean</div>';
    return;
  }

  players.slice(0, 8).forEach((p,i)=>{
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="num">${i+1}</div>
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="score">${escapeHtml(p.score || "444")}</div>
      </div>
      ${i===0 ? '<div class="live">LIVE</div>' : ''}
    `;
    list.appendChild(row);
  });
}

function addPlayer(){
  const name = document.getElementById("name").value.trim();
  const score = document.getElementById("score").value.trim() || "444";
  if(!name) return;

  players.push({name,score});
  document.getElementById("name").value="";
  save(); render();
}

function nextPlayer(){
  if(players.length){
    players.shift();
    save(); render();
  }
}

function clearQueue(){
  if(confirm("Hapus semua antrean?")){
    players=[];
    save(); render();
  }
}

function escapeHtml(text){
  const d=document.createElement("div");
  d.textContent=text;
  return d.innerHTML;
}

render();
</script>

</body>
</html>
